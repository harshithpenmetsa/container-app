apiVersion: apps/v1
kind: Deployment

metadata:
  name: container-app

spec:
  replicas: 2

  selector:
    matchLabels:
      app: container-app

  template:
    metadata:
      labels:
        app: container-app

    spec:
      containers:
        - name: container-app
          image: harshithpenmetsa/container-app:v1
          ports:
            - containerPort: 5000